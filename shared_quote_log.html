<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shared Quote Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15181c;
    --ink-soft:#3b4149;
    --paper:#f6f5f2;
    --panel:#ffffff;
    --line:#d8d6cf;
    --line-strong:#15181c;
    --yellow:#f4b400;
    --yellow-deep:#c98e00;
    --red:#b8402c;
    --red-bg:#fbe9e5;
    --amber:#a06a00;
    --amber-bg:#fdf0d8;
    --green:#3f6b4f;
    --green-bg:#e7efe8;
    --blue:#2f5f8a;
    --blue-bg:#e6eef4;
    --steel:#6b7280;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1100px;margin:0 auto;padding:28px 20px 80px;}

  .board-head{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:3px solid var(--line-strong);padding-bottom:16px;margin-bottom:20px;
    gap:16px;flex-wrap:wrap;
  }
  .board-head .mark{display:flex;align-items:center;gap:10px;}
  .board-head .chip{
    width:34px;height:34px;flex:none;object-fit:contain;
  }
  .board-head h1{
    font-family:'Oswald',sans-serif;font-weight:600;font-size:26px;letter-spacing:0.01em;
    margin:0;line-height:1.05;
  }
  .board-head .sub{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .board-head .today{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);text-align:right;
  }
  .board-head .today strong{
    display:block;font-family:'Oswald',sans-serif;font-size:15px;color:var(--ink);font-weight:500;
  }

  .notice{
    background:#fff6df;border:1px solid var(--yellow-deep);padding:10px 14px;
    font-size:12px;color:var(--ink-soft);margin-bottom:18px;
  }
  .notice b{color:var(--ink);}

  .stats{
    display:grid;grid-template-columns:repeat(5,1fr);gap:1px;
    background:var(--line-strong);border:1px solid var(--line-strong);margin-bottom:22px;
  }
  .stat{background:var(--panel);padding:14px 16px;}
  .stat .n{font-family:'Oswald',sans-serif;font-size:28px;font-weight:600;line-height:1;}
  .stat .l{font-size:11.5px;color:var(--ink-soft);margin-top:5px;}
  .stat.expiring .n{color:var(--amber);}
  .stat.active .n{color:var(--blue);}
  .stat.placed .n{color:var(--green);}
  .stat.expired .n{color:var(--red);}
  .stat.discrepancy .n{color:var(--red);}

  .toolbar{
    display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;
    justify-content:space-between;
  }
  .filters{display:flex;gap:6px;flex-wrap:wrap;}
  .filter-btn{
    font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;
    padding:6px 10px;background:var(--panel);border:1px solid var(--line);cursor:pointer;color:var(--ink-soft);
  }
  .filter-btn.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .btn-primary{
    font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:0.02em;padding:9px 18px;
    background:var(--yellow);border:1px solid var(--line-strong);cursor:pointer;color:var(--ink);font-weight:500;
  }
  .btn-primary:hover{background:var(--yellow-deep);}
  .btn-ghost{
    font-family:'IBM Plex Sans',sans-serif;font-size:12px;padding:6px 12px;background:none;
    border:1px solid var(--line);cursor:pointer;color:var(--ink-soft);
  }
  .btn-ghost:hover{border-color:var(--ink);color:var(--ink);}
  .btn-small{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:0.03em;
    padding:5px 9px;border:1px solid var(--line-strong);background:var(--panel);cursor:pointer;color:var(--ink);
  }
  .btn-small.go{background:var(--green);color:#fff;border-color:var(--green);}
  .btn-small.go:hover{background:#345c40;}

  .board{border:1px solid var(--line-strong);background:var(--panel);}
  .row{
    display:grid;grid-template-columns:6px 1.6fr 1.2fr 90px 100px 110px 150px 90px;
    align-items:center;border-bottom:1px solid var(--line);min-height:58px;
  }
  .row:last-child{border-bottom:none;}
  .row.head{background:var(--ink);color:var(--paper);min-height:36px;}
  .row.head .cell{
    font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;
    letter-spacing:0.05em;color:#c9ccd1;
  }
  .stripe{height:100%;}
  .stripe.expiring{background:var(--amber);}
  .stripe.active{background:var(--blue);}
  .stripe.placed{background:var(--green);}
  .stripe.expired{background:var(--red);}
  .cell{padding:8px 10px;font-size:13px;}
  .cell.cust{display:flex;flex-direction:column;gap:2px;}
  .cell.cust .n{font-weight:600;}
  .cell.cust .m{font-size:10.5px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .lane-tag{
    display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;
    padding:1px 6px;border:1px solid var(--steel);color:var(--ink-soft);width:fit-content;margin-bottom:2px;
  }
  .cell.mono{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .status-pill{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.02em;
    padding:4px 7px;display:inline-block;font-weight:600;
  }
  .status-pill.expiring{background:var(--amber-bg);color:var(--amber);}
  .status-pill.active{background:var(--blue-bg);color:var(--blue);}
  .status-pill.placed{background:var(--green-bg);color:var(--green);}
  .status-pill.expired{background:var(--red-bg);color:var(--red);}
  .row-actions{display:flex;gap:5px;justify-content:flex-end;padding-right:8px;flex-wrap:wrap;}
  .icon-btn{background:none;border:none;cursor:pointer;font-size:13px;color:var(--steel);padding:2px 4px;}
  .icon-btn:hover{color:var(--ink);}

  .empty{padding:40px 20px;text-align:center;color:var(--ink-soft);font-size:14px;}

  .overlay{
    position:fixed;inset:0;background:rgba(21,24,28,0.55);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal{background:var(--panel);border:1px solid var(--line-strong);width:100%;max-width:480px;padding:22px;max-height:90vh;overflow-y:auto;}
  .modal h3{
    font-family:'Oswald',sans-serif;font-size:18px;font-weight:600;margin:0 0 16px;
    padding-bottom:10px;border-bottom:2px solid var(--yellow);
  }
  .field{margin-bottom:13px;}
  .field label{
    display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;
    color:var(--ink-soft);margin-bottom:4px;font-family:'IBM Plex Mono',monospace;
  }
  .field input, .field select, .field textarea{
    width:100%;padding:8px 10px;border:1px solid var(--line);
    font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;background:var(--paper);color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:44px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-actions{display:flex;justify-content:space-between;margin-top:18px;gap:10px;}
  .help{
    font-size:12px;color:var(--ink-soft);margin-bottom:18px;line-height:1.5;
    padding:12px 14px;background:var(--panel);border:1px solid var(--line);
  }
  .help b{color:var(--ink);}
  .detail-row{
    display:grid;grid-template-columns:170px 1fr;gap:10px;padding:7px 12px;
    border-bottom:1px solid var(--line);font-size:12.5px;
  }
  .detail-row:last-child{border-bottom:none;}
  .detail-row:nth-child(even){background:#fbfaf8;}
  .detail-row .dl{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.03em;}
  .detail-row .dv{font-weight:500;}
  .discrepancy-badge{
    display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;
    background:var(--red-bg);color:var(--red);padding:2px 6px;margin-left:6px;
    letter-spacing:0.02em;font-weight:600;vertical-align:middle;
  }

  @media (max-width:760px){
    .row{grid-template-columns:6px 1fr 90px;}
    .cell.mono,.cell.lane-cell,.cell.quoter{display:none;}
    .row.head .cell:not(:first-child):not(:nth-child(2)):not(:last-child){display:none;}
    .stats{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const AUTO_EXPIRE_DAYS = 30;

let state = {
  quotes: [],
  loaded: false,
  filter: 'all',
  modalOpen: false,
  editingId: null,
  viewingId: null
};

function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(s){
  if(!s) return '—';
  const d = new Date(s+'T00:00:00');
  return d.toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'});
}
function addDays(dateStr, days){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function daysBetween(a,b){
  const A=new Date(a+'T00:00:00'), B=new Date(b+'T00:00:00');
  return Math.round((B-A)/(1000*60*60*24));
}

function computeStatus(q){
  if(q.orderPlaced) return {key:'placed', label:'Order Placed'};
  const today = todayStr();
  const daysLeft = daysBetween(today, q.validUntil);
  if(daysLeft < 0) return {key:'expired', label:'Expired'};
  if(daysLeft <= 7) return {key:'expiring', label:`Expiring — ${daysLeft}d left`};
  return {key:'active', label:`Active — ${daysLeft}d left`};
}

const FIREBASE_URL = 'https://rate-manager-dsl-default-rtdb.firebaseio.com';
const POLL_INTERVAL_MS = 20000; // refresh from Firebase every 20s so the shared view stays current
let pollTimer = null;

async function loadData(showLoadingState){
  if(showLoadingState !== false){ /* keep existing UI during background polls */ }
  try{
    const res = await fetch(`${FIREBASE_URL}/quotes.json`);
    const data = await res.json();
    state.quotes = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
    state.loadError = false;
  }catch(e){
    console.error('Load failed', e);
    state.loadError = true;
  }
  state.loaded = true;
  render();
}

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(() => loadData(false), POLL_INTERVAL_MS);
}

function openModal(id){ state.editingId = id || null; state.modalOpen = true; render(); }
function closeModal(){ state.modalOpen = false; state.editingId = null; render(); }
function openDetail(id){ state.viewingId = id; render(); }
function closeDetail(){ state.viewingId = null; render(); }

async function saveQuote(formEl){
  const fd = new FormData(formEl);
  const quotedDate = fd.get('quotedDate') || todayStr();
  const validUntil = fd.get('validUntil') || addDays(quotedDate, AUTO_EXPIRE_DAYS);
  const existing = state.editingId ? (state.quotes.find(q=>q.id===state.editingId) || {}) : {};
  const data = {
    customer: fd.get('customer').trim(),
    quoteType: fd.get('quoteType'),
    from: fd.get('from').trim(),
    to: fd.get('to').trim(),
    rate: fd.get('rate').trim(),
    quotedBy: fd.get('quotedBy').trim(),
    quotedDate,
    validUntil,
    notes: fd.get('notes').trim(),
    orderPlaced: existing.orderPlaced || false
  };
  if(!data.customer) return;
  try{
    if(state.editingId){
      await fetch(`${FIREBASE_URL}/quotes/${state.editingId}.json`, {
        method: 'PATCH',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(data)
      });
    } else {
      await fetch(`${FIREBASE_URL}/quotes.json`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(data)
      });
    }
  }catch(e){ console.error('Save failed', e); }
  closeModal();
  await loadData();
}

async function markOrderPlaced(id){
  state.quotes = state.quotes.map(q => q.id===id ? {...q, orderPlaced:true} : q); // optimistic UI update
  render();
  try{
    await fetch(`${FIREBASE_URL}/quotes/${id}.json`, {
      method: 'PATCH', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({orderPlaced:true})
    });
  }catch(e){ console.error('Update failed', e); }
}
async function reopenQuote(id){
  state.quotes = state.quotes.map(q => q.id===id ? {...q, orderPlaced:false} : q);
  render();
  try{
    await fetch(`${FIREBASE_URL}/quotes/${id}.json`, {
      method: 'PATCH', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({orderPlaced:false})
    });
  }catch(e){ console.error('Update failed', e); }
}
async function deleteQuote(id){
  state.quotes = state.quotes.filter(q=>q.id!==id);
  render();
  try{
    await fetch(`${FIREBASE_URL}/quotes/${id}.json`, { method: 'DELETE' });
  }catch(e){ console.error('Delete failed', e); }
}

async function saveDiscrepancy(id, formEl){
  const fd = new FormData(formEl);
  const discrepancyFlag = fd.get('discrepancyFlag') === 'on';
  const discrepancyNotes = (fd.get('discrepancyNotes')||'').trim();
  state.quotes = state.quotes.map(q => q.id===id ? {...q, discrepancyFlag, discrepancyNotes} : q); // optimistic
  render();
  try{
    await fetch(`${FIREBASE_URL}/quotes/${id}.json`, {
      method: 'PATCH', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({discrepancyFlag, discrepancyNotes})
    });
  }catch(e){ console.error('Discrepancy save failed', e); }
}

function setFilter(f){ state.filter = f; render(); }

function counts(){
  const c = {expiring:0, active:0, placed:0, expired:0, discrepancy:0};
  state.quotes.forEach(q=>{
    c[computeStatus(q).key]++;
    if(q.discrepancyFlag) c.discrepancy++;
  });
  return c;
}

function renderStats(){
  const c = counts();
  return `
  <div class="stats">
    <div class="stat expiring"><div class="n">${c.expiring}</div><div class="l">Expiring within 7 days</div></div>
    <div class="stat active"><div class="n">${c.active}</div><div class="l">Active quotes</div></div>
    <div class="stat placed"><div class="n">${c.placed}</div><div class="l">Order placed</div></div>
    <div class="stat expired"><div class="n">${c.expired}</div><div class="l">Expired, unresolved</div></div>
    <div class="stat discrepancy"><div class="n">${c.discrepancy}</div><div class="l">Discrepancies flagged</div></div>
  </div>`;
}

function filteredQuotes(){
  let list = [...state.quotes];
  if(state.filter === 'discrepancy'){
    list = list.filter(q => q.discrepancyFlag);
  } else if(state.filter !== 'all'){
    list = list.filter(q => computeStatus(q).key === state.filter);
  }
  const rank = {expired:0, expiring:1, active:2, placed:3};
  list.sort((a,b)=> rank[computeStatus(a).key]-rank[computeStatus(b).key] || a.validUntil.localeCompare(b.validUntil));
  return list;
}

function renderBody(){
  const list = filteredQuotes();
  const filters = [['all','All'], ['expiring','Expiring Soon'], ['active','Active'], ['placed','Order Placed'], ['expired','Expired'], ['discrepancy','Discrepancies']];

  const rows = list.map(q=>{
    const st = computeStatus(q);
    const hasFullDetail = !!q.fullQuoteText;
    return `
    <div class="row">
      <div class="stripe ${st.key}"></div>
      <div class="cell cust">
        <span class="n">${escapeHtml(q.customer)}${q.discrepancyFlag ? ' <span class="discrepancy-badge">⚠ Discrepancy</span>' : ''}</span>
        <span class="m">${escapeHtml(q.quoteType||'')}${hasFullDetail?' · auto-logged':''}</span>
      </div>
      <div class="cell lane-cell mono">${escapeHtml(q.from)} &rarr; ${escapeHtml(q.to)}</div>
      <div class="cell mono">${escapeHtml(q.rate||'—')}</div>
      <div class="cell mono">${fmtDate(q.quotedDate)}</div>
      <div class="cell mono">${fmtDate(q.validUntil)}</div>
      <div class="cell"><span class="status-pill ${st.key}">${st.label}</span></div>
      <div class="cell row-actions">
        ${hasFullDetail ? `<button class="btn-small" onclick="openDetail('${q.id}')">View</button>` : ''}
        ${!q.orderPlaced ? `<button class="btn-small go" onclick="markOrderPlaced('${q.id}')">Order Placed</button>` : `<button class="btn-small" onclick="reopenQuote('${q.id}')">Reopen</button>`}
        <button class="icon-btn" title="Edit" onclick="openModal('${q.id}')">✎</button>
        <button class="icon-btn" title="Remove" onclick="deleteQuote('${q.id}')">✕</button>
      </div>
    </div>`;
  }).join('');

  return `
  <div class="toolbar">
    <div class="filters">
      ${filters.map(([k,l])=>`<button class="filter-btn ${state.filter===k?'active':''}" onclick="setFilter('${k}')">${l}</button>`).join('')}
    </div>
    <button class="btn-primary" onclick="openModal()">+ Log a Quote</button>
  </div>
  <div class="board">
    <div class="row head">
      <div></div>
      <div class="cell">Customer / Type</div>
      <div class="cell">Lane</div>
      <div class="cell">Rate</div>
      <div class="cell">Quoted</div>
      <div class="cell">Valid Until</div>
      <div class="cell">Status</div>
      <div class="cell"></div>
    </div>
    ${rows || '<div class="empty">No quotes logged yet. Log a quote right after sending it to a customer.</div>'}
  </div>`;
}

function renderModal(){
  if(!state.modalOpen) return '';
  const editing = state.quotes.find(q=>q.id===state.editingId);
  const defaultQuoted = editing ? editing.quotedDate : todayStr();
  const defaultValid = editing ? editing.validUntil : addDays(todayStr(), AUTO_EXPIRE_DAYS);
  return `
  <div class="overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <h3>${editing ? 'Edit Quote' : 'Log a Quote'}</h3>
      <form id="quote-form" onsubmit="event.preventDefault(); saveQuote(this);">
        <div class="field">
          <label>Customer</label>
          <input name="customer" required value="${editing?escapeHtml(editing.customer):''}" placeholder="Customer name">
        </div>
        <div class="field-row">
          <div class="field">
            <label>Quote Type</label>
            <select name="quoteType">
              ${['Import','Export','Rail Import','Rail Export','STD Local'].map(t=>`<option value="${t}" ${editing&&editing.quoteType===t?'selected':''}>${t}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Rate</label>
            <input name="rate" value="${editing?escapeHtml(editing.rate||''):''}" placeholder="e.g. $650 total">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>From</label>
            <input name="from" value="${editing?escapeHtml(editing.from||''):''}" placeholder="Origin">
          </div>
          <div class="field">
            <label>To</label>
            <input name="to" value="${editing?escapeHtml(editing.to||''):''}" placeholder="Destination">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Quoted Date</label>
            <input type="date" name="quotedDate" value="${defaultQuoted}">
          </div>
          <div class="field">
            <label>Valid Until <span style="text-transform:none;">(auto +30d)</span></label>
            <input type="date" name="validUntil" value="${defaultValid}">
          </div>
        </div>
        <div class="field">
          <label>Quoted By</label>
          <input name="quotedBy" value="${editing?escapeHtml(editing.quotedBy||''):''}" placeholder="Your name">
        </div>
        <div class="field">
          <label>Notes</label>
          <textarea name="notes" placeholder="Container type, steamship line, anything Imports/Exports would need">${editing?escapeHtml(editing.notes||''):''}</textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-ghost" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn-primary">${editing?'Save Changes':'Log Quote'}</button>
        </div>
      </form>
    </div>
  </div>`;
}

function renderDetailModal(){
  if(!state.viewingId) return '';
  const q = state.quotes.find(x=>x.id===state.viewingId);
  if(!q) return '';

  const money = (v) => (v===undefined||v===null||v==='') ? null : `$${parseFloat(v).toFixed(2)}`;
  const rows = [
    ['Container Type', q.containerType],
    ['Steamship Line', q.steamshipLine],
    ['Transport Rate', money(q.transportRate)],
    ['Fuel Surcharge', q.fuelSurchargePercent!==undefined ? `${q.fuelSurchargePercent}%` : null],
    ['Chassis Rate', money(q.chassisRate)],
    ['Live Unload Rate', money(q.liveUnloadRate)],
    ['Tanker Surcharge', money(q.tankerSurcharge)],
    ['Hazmat Surcharge', money(q.hazmatSurcharge)],
    ['Triaxle Surcharge', money(q.triaxleSurcharge)],
    ['Split Chassis Fee', money(q.splitChassisFee)],
    ['Residential Delivery', money(q.residentialDelivery)],
    ['Reefer Surcharge', money(q.reeferSurcharge)],
    ['GenSet Surcharge', money(q.gensetSurcharge)],
    ['Scale Ticket Fee', money(q.scaleTicketFee)],
    ['Drop Location', q.dropLocation],
    ['Storage Included', q.includeStorage!==undefined ? (q.includeStorage ? `Yes (${q.storageDays||'?'} days)` : 'No') : null],
    ['No-Chassis Option', q.includeNoChassis!==undefined ? (q.includeNoChassis ? 'Yes' : 'No') : null],
    ['Max Cargo Weight', (q.maxCargoToggle && q.maxCargoWeight) ? `${q.maxCargoWeight} lbs` : null],
  ].filter(([,v]) => v !== null && v !== undefined && v !== '');

  const customFieldsRows = (q.customFields||[]).map(f => [f.name, f.value]);

  const detailRow = ([label,val]) => `
    <div class="detail-row"><span class="dl">${escapeHtml(label)}</span><span class="dv">${escapeHtml(String(val))}</span></div>`;

  return `
  <div class="overlay" onclick="if(event.target===this) closeDetail()">
    <div class="modal" style="max-width:600px;">
      <h3>${escapeHtml(q.customer)} &mdash; ${escapeHtml(q.quoteType||'')}</h3>
      <div style="font-size:12px;color:var(--ink-soft);margin-bottom:14px;">
        ${escapeHtml(q.from)} &rarr; ${escapeHtml(q.to)} &middot; Quoted ${fmtDate(q.quotedDate)} &middot; Valid until ${fmtDate(q.validUntil)}
      </div>

      ${rows.length ? `
      <div style="border:1px solid var(--line);margin-bottom:14px;">
        ${rows.map(detailRow).join('')}
      </div>` : ''}

      ${customFieldsRows.length ? `
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);margin-bottom:6px;">Custom Fields</div>
      <div style="border:1px solid var(--line);margin-bottom:14px;">
        ${customFieldsRows.map(detailRow).join('')}
      </div>` : ''}

      ${q.fullQuoteText ? `
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);margin-bottom:6px;">Verbatim Quote Sent to Customer</div>
      <div style="border:1px solid var(--line);background:var(--paper);padding:12px;font-size:12px;white-space:pre-wrap;max-height:260px;overflow-y:auto;font-family:'IBM Plex Mono',monospace;">${escapeHtml(q.fullQuoteText)}</div>` : ''}

      <div style="border:2px solid var(--red);background:var(--red-bg);padding:14px 16px;margin-top:16px;">
        <div style="font-family:'Oswald',sans-serif;font-size:13.5px;font-weight:600;color:var(--red);margin-bottom:10px;">Discrepancy vs. Actual Order</div>
        <form id="discrepancy-form-${q.id}" onsubmit="event.preventDefault(); saveDiscrepancy('${q.id}', this);">
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:10px;cursor:pointer;">
            <input type="checkbox" name="discrepancyFlag" ${q.discrepancyFlag?'checked':''} style="width:16px;height:16px;accent-color:var(--red);">
            Flag this quote &mdash; the order didn't match what was quoted
          </label>
          <textarea name="discrepancyNotes" placeholder="What didn't match? e.g. container size entered as 20' but quoted as 40', or wrong destination code used" style="width:100%;min-height:60px;padding:8px 10px;border:1px solid var(--line);font-family:'IBM Plex Sans',sans-serif;font-size:13px;background:var(--panel);margin-bottom:10px;">${escapeHtml(q.discrepancyNotes||'')}</textarea>
          <button type="submit" class="btn-small" style="background:var(--red);color:#fff;border-color:var(--red);">Save Discrepancy Notes</button>
        </form>
      </div>

      <div class="modal-actions" style="margin-top:16px;">
        <button type="button" class="btn-ghost" onclick="closeDetail()">Close</button>
      </div>
    </div>
  </div>`;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.innerText = str || '';
  return d.innerHTML;
}

function render(){
  const app = document.getElementById('app');
  if(!state.loaded){ app.innerHTML = `<div class="empty">Loading log…</div>`; return; }
  const errorBanner = state.loadError ? `<div class="notice" style="background:#fbe9e5;border-color:#b8402c;"><b>Connection issue.</b> Couldn't reach the shared database just now — showing the last data loaded. Will retry automatically.</div>` : '';
  app.innerHTML = `
    ${renderHeader()}
    ${errorBanner}
    ${renderStats()}
    ${renderBody()}
    ${renderModal()}
    ${renderDetailModal()}
  `;
}

loadData();
startPolling();
</script>
</body>
</html>
